[package]
name = "stereo-backend"
version = "0.1.34"
edition = "2021"
publish = false

[[bin]]
name = "stereo"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = "0.5"
tower = "0.4"
futures = "0.3"

# HTTP client with Chrome TLS fingerprint impersonation to bypass Beatport bot-detection.
wreq = { version = "6.0.0-rc.29", features = ["json", "gzip", "brotli", "stream", "query", "form"] }
wreq-util = "3.0.0-rc.12"

# Embed frontend assets into the binary at compile time
rust-embed = "8"
axum-embed = "0.1"

# HTML parsing (replaces BeautifulSoup4)
scraper = "0.19"

# SQLite (replaces aiosqlite)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
strsim = "0.11"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
url = "2"

# Spotify integration: TOTP for the anonymous web-player token, regex/base64 for
# extracting persisted-query hashes and decoding the app server config out of Spotify's
# obfuscated JS/HTML.
totp-rs = "5"
regex = "1"
base64 = "0.22"
# Reads Spotify session cookies directly from installed browsers, as an alternative to
# manually pasting the Cookie header.
rookie = "0.5"
