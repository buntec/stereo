[package]
name = "stereo-desktop"
version = "0.1.64"
description = "Desktop app for Stereo"
edition = "2021"
publish = false

[lib]
name = "stereo_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
