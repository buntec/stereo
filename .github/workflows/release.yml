name: Release

on:
  push:
    tags:
      - 'v*'
  # A trial run: builds everything, but keeps it as workflow artifacts instead of releasing it.
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: stereo
            artifact_name: stereo-linux-x86_64
          - os: ubuntu-24.04-arm
            binary: stereo
            artifact_name: stereo-linux-aarch64
          # GitHub's last Intel macOS image (macos-13 is retired: its jobs never got a runner).
          - os: macos-15-intel
            binary: stereo
            artifact_name: stereo-macos-x86_64
          - os: macos-latest
            binary: stereo
            artifact_name: stereo-macos-aarch64
          - os: windows-latest
            binary: stereo.exe
            artifact_name: stereo-windows-x86_64.exe

    env:
      # linuxdeploy, which bundles the AppImage, is an AppImage itself; the runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Build frontend
        run: bun install && bun run build

      # rookie's libesedb is LGPL. Cargo.toml patches in a stub, which a new resolution could drop.
      # Fails closed: on any Cargo error, and unless every libesedb resolved is the stub.
      - name: Check that libesedb is the stub
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc \
            > "$RUNNER_TEMP/metadata.json"
          METADATA="$RUNNER_TEMP/metadata.json" bun -e '
            const { packages, resolve } = await Bun.file(process.env.METADATA).json();
            const resolved = new Set(resolve.nodes.map((node) => node.id));
            const used = packages.filter((p) => resolved.has(p.id));
            const sys = used.filter((p) => p.name === "libesedb-sys");
            const esedb = used.filter((p) => p.name === "libesedb");
            const stub = (p) => p.source === null &&
              p.manifest_path.replaceAll("\\", "/").endsWith("/vendor/libesedb-stub/Cargo.toml");
            const errors = [
              ...sys.map((p) => `libesedb-sys ${p.version} is a dependency`),
              ...esedb.filter((p) => !stub(p)).map((p) => `libesedb ${p.version} is ${p.source}`),
              ...(esedb.length ? [] : ["libesedb is no dependency: drop the stub and its patch"]),
            ];
            for (const error of errors) console.log(`::error::${error}`);
            process.exit(errors.length ? 1 : 0);
          '

      - name: Build binary
        run: cargo build --release --locked

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: strip target/release/${{ matrix.binary }}

      - name: Package binary
        shell: bash
        run: cp target/release/${{ matrix.binary }} ${{ matrix.artifact_name }}

      # Before the desktop app, so that a failing desktop build still releases the binary.
      - name: Upload binary to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true

      - name: Upload binary as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      # The desktop app (desktop/README.md), bundling the binary above as its sidecar, as
      # `just desktop-build` does.
      - name: Install desktop app build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf

      - name: Add sidecar to desktop app
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp "target/release/stereo$ext" "desktop/src-tauri/binaries/stereo-$(rustc --print host-tuple)$ext"

      - name: Build desktop app
        shell: bash
        working-directory: desktop
        run: |
          bun install
          if [ "$RUNNER_OS" = macOS ]; then
            # Not signed with a Developer ID or notarized: ad-hoc signed, so that the app opens
            # once allowed in System Settings › Privacy & Security, rather than "is damaged".
            bun run build -- --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          else
            bun run build
          fi

      - name: Upload desktop app to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload desktop app as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
