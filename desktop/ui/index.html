<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stereo</title>
    <!-- Shown until Stereo's backend is up, when the window navigates to it, and for errors. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --fg: #1f1f23;
        --muted: #6b6b75;
        --error: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --fg: #e6e6ea;
          --muted: #9a9aa4;
          --error: #f97066;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 560px;
        padding: 0 24px;
        text-align: center;
      }
      #status {
        color: var(--muted);
      }
      #status.error {
        color: var(--error);
      }
      form {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        font: inherit;
      }
      button {
        font: inherit;
      }
      pre {
        margin: 0;
        max-width: 100%;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--muted);
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" width="72" height="72" alt="" />
      <div id="status">Starting Stereo…</div>
      <!-- Submitted as `?stereo-token=…`, which the app intercepts (`submitted_token`). -->
      <form id="token-form" hidden>
        <input
          id="token"
          name="stereo-token"
          type="password"
          autocomplete="off"
          required
          aria-label="WebSocket token"
        />
        <button type="submit">Connect</button>
      </form>
      <pre id="details" hidden></pre>
    </main>
    <script>
      // The desktop app comes back here with `#{"message":…,"details":…}` when Stereo's backend
      // can't be started or stops, and with `#{"message":…,"token":true}` when it wants a token
      // (see src-tauri/src/lib.rs). Coming back to this page only changes its fragment.
      const form = document.getElementById("token-form");
      form.addEventListener("submit", () => {
        form.querySelector("button").disabled = true;
      });
      const render = () => {
        if (location.hash.length <= 1) return;
        try {
          const { message, details, token, attempt } = JSON.parse(
            decodeURIComponent(location.hash.slice(1)),
          );
          const status = document.getElementById("status");
          status.textContent = token
            ? message
            : `${message} Quit and reopen Stereo to try again.`;
          status.className = token && !attempt ? "" : "error";
          const pre = document.getElementById("details");
          pre.textContent = details ?? "";
          pre.hidden = !details;
          form.hidden = !token;
          form.querySelector("button").disabled = false;
          if (token) {
            const input = document.getElementById("token");
            input.value = "";
            input.focus();
          }
        } catch {
          // Not an error, then.
        }
      };
      render();
      window.addEventListener("hashchange", render);
    </script>
  </body>
</html>
