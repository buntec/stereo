[package]
name = "stereo-backend"
version = "0.1.61"
edition = "2021"
publish = false

[[bin]]
name = "stereo"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"

# HTTP client with Chrome TLS fingerprint impersonation to bypass Beatport bot-detection.
wreq = { version = "6.0.0-rc.31", features = ["json", "gzip", "brotli", "stream", "query", "form"] }
wreq-util = "3.0.0-rc.14"

# Embed frontend assets into the binary at compile time
rust-embed = "8"
axum-embed = "0.1"

# HTML parsing (replaces BeautifulSoup4)
scraper = "0.29"

# SQLite (replaces aiosqlite)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
strsim = "0.11"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
url = "2"

# Spotify integration: TOTP for the anonymous web-player token, regex/base64 for
# extracting persisted-query hashes and decoding the app server config out of Spotify's
# obfuscated JS/HTML.
totp-rs = "6"
regex = "1"
base64 = "0.23"
# Reads Spotify session cookies directly from installed browsers, as an alternative to
# manually pasting the Cookie header.
rookie = "0.5"
# Finds every browser profile's cookie store from rookie's path patterns (rookie only reads the
# first), for importing Beatport's Cloudflare clearance from the profile that earned it.
glob = "0.3"
# Signs YouTube API requests (SAPISIDHASH) the way YouTube's web client does.
sha1 = "0.11"
# Applies a browser cookie database's write-ahead log to a copy before rookie reads it (rookie opens
# databases as immutable, which skips the WAL). The version rookie already uses.
rusqlite = "0.31"
# Decodes downloaded audio (YouTube's AAC in MP4) for the player's waveform, in pure Rust.
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }

[target.'cfg(unix)'.dependencies]
# Ends the process group of a desktop app's backend (`--exit-with-stdin`) when the app is gone.
libc = "0.2"

# Decoding a track for its waveform takes many seconds unoptimized; optimize the decoder in debug
# builds too.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

[dev-dependencies]
# WebSocket client for end-to-end session tests (the version axum already uses).
tokio-tungstenite = "0.29"
